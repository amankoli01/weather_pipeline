
      - name: Verify population CSV
        run: |
          echo "Current branch:"
          git branch --show-current

          echo "Repository root:"
          pwd

          echo "Root directory:"
          ls -la

          echo "Data directory:"
          ls -la data || true

          echo "CSV files tracked by Git:"
          git ls-files | grep -i 'population.csv' || true

          if [ -f "data/population.csv" ]; then
            echo "SUCCESS: population.csv found"
            head -n 3 data/population.csv
          else
            echo "ERROR: data/population.csv not found"
            find . -iname '*population*.csv' -print
            exit 1
          fi
